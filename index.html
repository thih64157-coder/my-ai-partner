<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Partner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      height: 100vh;
    }

    .app {
      max-width: 600px;
      margin: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .header {
      background: #222;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 82%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 16px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .user {
      margin-left: auto;
      background: #d9fdd3;
    }

    .ai {
      margin-right: auto;
      background: #eeeeee;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 22px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 50px;
      border: none;
      border-radius: 50%;
      background: #222;
      color: white;
      font-size: 20px;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    My AI Partner 🤖
  </div>

  <div id="chat">
    <div class="message ai">
      မင်္ဂလာပါ 👋<br>

    </div>
  </div>

  <div class="input-area">
    <input
      id="message"
      type="text"
      placeholder="မေးချင်တာရေးပါ..."
      onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button id="send" onclick="sendMessage()">➤</button>
  </div>

</div>
