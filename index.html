 <!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Partner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      height: 100vh;
    }

    .app {
      max-width: 600px;
      margin: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .header {
      background: #222;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 82%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 16px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .user {
      margin-left: auto;
      background: #d9fdd3;
    }

    .ai {
      margin-right: auto;
      background: #eeeeee;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 22px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 50px;
      border: none;
      border-radius: 50%;
      background: #222;
      color: white;
      font-size: 20px;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    My AI Partner 🤖
  </div>

  <div id="chat">
    <div class="message ai">
      မင်္ဂလာပါ 👋<br>
      ကျွန်တော်က My AI Partner ပါ။ ဘာမေးချင်လဲ?
    </div>
  </div>

  <div class="input-area">
    <input
      id="message"
      type="text"
      placeholder="မေးချင်တာရေးပါ..."
      onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button id="send" onclick="sendMessage()">➤</button>
  </div>

</div>

<script>

const API_URL =
  "https://my-ai-partner-zgzz.onrender.com/chat";

async function sendMessage() {

  const input = document.getElementById("message");
  const button = document.getElementById("send");
  const chat = document.getElementById("chat");

  const message = input.value.trim();

  if (!message) return;

  // User message
  const userDiv = document.createElement("div");
  userDiv.className = "message user";
  userDiv.textContent = message;
  chat.appendChild(userDiv);

  input.value = "";
  button.disabled = true;

  // AI message
  const aiDiv = document.createElement("div");
  aiDiv.className = "message ai";
  aiDiv.textContent = "စဉ်းစားနေပါတယ်...";
  chat.appendChild(aiDiv);

  chat.scrollTop = chat.scrollHeight;

  const maxRetries = 3;

  try {

    let data = null;

    for (let attempt = 1; attempt <= maxRetries; attempt++) {

      try {

        const response = await fetch(API_URL, {
          method: "POST",
          mode: "cors",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        data = await response.json();

        // Success
        if (data.reply) {
          aiDiv.textContent = data.reply;
          break;
        }

        // Gemini 503 → retry
        if (
          data.status === 503 ||
          data.error?.error?.code === 503
        ) {

          if (attempt < maxRetries) {
            aiDiv.textContent =
              "ခဏစောင့်ပါနော်... ပြန်ကြိုးစားနေပါတယ် 🔄";

            await new Promise(resolve =>
              setTimeout(resolve, 2000)
            );

            continue;
          }
        }

        // Other error
        aiDiv.textContent =
          "တစ်ခုခုမှားနေပါတယ်။ ခဏနေပြီး ပြန်စမ်းကြည့်ပါ။";

      } catch (error) {

        if (attempt < maxRetries) {

          aiDiv.textContent =
            "ဆက်သွယ်နေပါတယ်... 🔄";

          await new Promise(resolve =>
            setTimeout(resolve, 2000)
          );

          continue;

        } else {

          aiDiv.textContent =
            "Server နဲ့ ဆက်သွယ်လို့မရသေးပါ။ ခဏနေပြီး ပြန်စမ်းကြည့်ပါ။";
        }
      }
    }

  } catch (error) {

    aiDiv.textContent =
      "တစ်ခုခုမှားနေပါတယ်။ ခဏနေပြီး ပြန်စမ်းကြည့်ပါ။";

  }

  button.disabled = false;
  input.focus();
  chat.scrollTop = chat.scrollHeight;
}
 if (!response.ok) {
  throw new Error("Server error: " + response.status);
 }

  const data = await response.json();

  aiDiv.textContent = JSON.stringify(data);

}  catch (error) {
  aiDiv.textContent = "ERROR: " + error.message;
 }

button.disabled = false;
input.focus();
chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
